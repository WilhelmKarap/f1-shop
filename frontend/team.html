<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101216" />
    <meta name="description" content="Коллекция F1 Posters по командам Формулы 1." />
    <title>Команда | F1 Posters</title>
    <link rel="stylesheet" href="catalog-pages.css?v=20260811-2" />
  </head>
  <body class="team-page">
    <header class="page-header">
      <a class="page-brand" href="index.html"><b>F1</b><span>Posters</span></a>
      <nav><a href="index.html#teams">Команды</a><a href="index.html#catalog">Каталог</a><a class="page-cart" href="index.html#catalog">Корзина <b id="cartCount">0</b></a></nav>
    </header>
    <main>
      <section class="team-story" id="teamStory">
        <div class="team-story__stage" id="teamHero">
          <div class="team-story__fallback"></div>
          <img class="team-story__background hidden" id="teamBackground" alt="" />
          <div class="team-story__tint"></div>
          <img class="team-story__foreground hidden" id="teamForeground" alt="" />
          <div class="team-story__shade"></div>

          <a class="back-link team-story__back" href="index.html#teams">← Все команды</a>
          <div class="team-story__meter" aria-hidden="true"><span>TEAM</span><i><b></b></i><span id="teamMeterValue">000</span></div>

          <div class="team-story__identity team-story__copy">
            <img class="team-story__logo hidden" id="teamLogo" alt="" />
            <p>Коллекция команды</p>
            <h1 id="teamName">F1 Posters</h1>
            <div class="driver-list" id="teamDrivers"></div>
          </div>

          <div class="team-story__narrative team-story__copy">
            <p id="teamFounded"></p>
            <p id="teamHistory"></p>
            <p id="teamAchievements"></p>
            <p id="teamLegends"></p>
          </div>
          <div class="team-story__scroll" aria-hidden="true"><span>Прокрутите</span><i></i></div>
        </div>
      </section>

      <section class="listing-section team-listing">
        <div class="listing-heading"><p id="teamProductCount">0 товаров</p><h2>Товары команды</h2></div>
        <div class="page-product-grid" id="teamProducts"><p class="page-message">Загружаем коллекцию</p></div>
      </section>
    </main>
    <footer class="page-footer"><span>F1 Posters</span><a id="managerLink" href="https://t.me/F1posters_mng" target="_blank" rel="noreferrer">Связаться с менеджером</a></footer>
    <div class="page-toast" id="toast" role="status"></div>
    <script src="config.js?v=20260810-1"></script>
    <script src="team-design.js?v=20260810-2"></script>
    <script src="team-page.js?v=20260811-1"></script>
  </body>
</html>
